[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cam-automation-lab"
version = "0.2.0"
description = "Offline CAM workflow learning and reviewed automation generation."
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]

[tool.setuptools.packages.find]
where = [".", "plugins/ug-cam-copilot/src"]
include = ["cam_automation*", "ugcam_ai*"]

[tool.setuptools.package-data]
cam_automation = ["web/*", "cad_integrations.json"]

[project.scripts]
cam-automation = "cam_automation.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"
